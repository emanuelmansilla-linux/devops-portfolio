name: Weekly Portfolio Audit

on:
  schedule:
    # Se ejecuta automáticamente todos los domingos a las 00:00
    - cron: '0 0 * * 0'
  workflow_dispatch: # Permite ejecutarlo manualmente desde GitHub

jobs:
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código fuente
        uses: actions/checkout@v4

      - name: Instalar herramientas de auditoría (Kubeval)
        run: |
          wget https://github.com/instrumenta/kubeval/releases/latest/download/kubeval-linux-amd64.tar.gz
          tar xf kubeval-linux-amd64.tar.gz
          sudo mv kubeval /usr/local/bin/

      - name: Validar Manifiestos de Kubernetes (TP12)
        run: |
          echo "Auditando archivos YAML en TP12/manifests/..."
          kubeval --strict TP12/manifests/*.yaml || echo "Advertencias encontradas, revisar logs."

      - name: Simulacro de Escaneo de Ciberseguridad (SAST)
        run: |
          echo "Iniciando análisis estático de vulnerabilidades en el monorepo..."
          echo "✅ Terraform config: OK"
          echo "✅ Dockerfiles: OK"
          echo "✅ Helm Charts: OK"
          echo "Auditoría DevSecOps semanal completada."